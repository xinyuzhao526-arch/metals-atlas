name: Refresh official copper and lithium news

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:23 China Standard Time. Only new official materials create a commit and deployment.
    - cron: "23 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: official-metals-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check official company sources
        id: refresh
        working-directory: apps/web
        run: |
          node scripts/update-news.mjs
          if git diff --quiet -- data/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.refresh.outputs.changed == 'true'
        working-directory: apps/web
        run: npm ci
      - name: Validate public site
        if: steps.refresh.outputs.changed == 'true'
        working-directory: apps/web
        run: |
          npm run test:unit
          npm run typecheck
          npm run build:pages
          test ! -d out/admin
      - uses: actions/configure-pages@v5
        if: steps.refresh.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.refresh.outputs.changed == 'true'
        with:
          path: apps/web/out
      - name: Commit new official materials
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/news.json
          git commit -m "data: refresh official metals news"
          git push origin main
      - name: Deploy refreshed public site
        id: deployment
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
