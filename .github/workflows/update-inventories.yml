name: Refresh copper exchange inventories

on:
  workflow_dispatch:
  schedule:
    # Poll hourly on exchange business days. Sources are idempotent; only a new report date creates a commit.
    - cron: "17 * * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: copper-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Read latest published reports
        id: refresh
        working-directory: apps/web
        run: |
          node scripts/update-inventories.mjs
          if git diff --quiet -- data/inventories.json data/sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.refresh.outputs.changed == 'true'
        working-directory: apps/web
        run: npm ci
      - name: Validate public site
        if: steps.refresh.outputs.changed == 'true'
        working-directory: apps/web
        run: |
          npm run test:unit
          npm run typecheck
          npm run build:pages
          test ! -d out/admin
          ! grep -R -E "https?://(localhost|127\.0\.0\.1)|D:\\\\Codex|C:\\\\Users|/home/runner/work" out data/inventories.json data/sources.json
      - uses: actions/configure-pages@v5
        if: steps.refresh.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.refresh.outputs.changed == 'true'
        with:
          path: apps/web/out
      - name: Commit verified observations
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data/inventories.json apps/web/data/sources.json
          git commit -m "data: refresh exchange copper inventories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Deploy refreshed public site
        id: deployment
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
